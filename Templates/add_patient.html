<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Patient</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text"
                           name="full_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Date of Birth</label>
                    <input type="date"
                           name="dob"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Glucose</label>
                    <input type="number"
                           step="0.01"
                           name="glucose"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Haemoglobin</label>
                    <input type="number"
                           step="0.01"
                           name="haemoglobin"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Cholesterol</label>
                    <input type="number"
                           step="0.01"
                           name="cholesterol"
                           class="form-control"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save Patient
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
